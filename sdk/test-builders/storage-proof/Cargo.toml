[package]
name = "storage-proof"
description = "Realistic test builder: an account and storage slots with EIP-1186 proofs (serde_json, alloy-primitives, alloy-rlp, alloy-trie, sha2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hemiprove-builder-sdk = { path = "../../hemiprove-builder-sdk" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
alloy-primitives = { version = "1", default-features = false, features = ["std", "serde", "rlp"] }
alloy-rlp = { version = "0.3", default-features = false, features = ["std", "derive"] }
alloy-trie = { version = "0.9", default-features = false, features = ["std", "ethereum"] }
sha2 = { version = "0.10", default-features = false }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
