[package]
name = "hemiprove-proxy-slots"
description = "The worked example of plan §12 as one statement: a proxy's EIP-1967 implementation, its code hash and the slots a rule names, at a pinned block; shared by its risc0 guest, its builder and requester tooling"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
std = ["hemiprove-eth-prelude/std"]

[dependencies]
hemiprove-eth-prelude = { path = "../../eth-prelude" }

[dev-dependencies]
alloy-trie = "0.9"
alloy-primitives = "1"
serde_json = "1"
hex = "0.4"
