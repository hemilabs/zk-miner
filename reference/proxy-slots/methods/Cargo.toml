[package]
name = "hemiprove-proxy-slots-methods"
description = "Builds the proxy-slots reference guest (and the lint control, host-input and risc0 3.0 test guests) with risc0-build, and tests them on the risc0 executor"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.risc0]
methods = ["../guest", "../lint-control", "../hostdep", "../keccak-3-0"]

[build-dependencies]
# The workspace patches these to the fork the miner pins (risc0-zkvm 3.1.0, risc0-build 3.0.7).
risc0-build = "3.0.7"

[dev-dependencies]
risc0-zkvm = { version = "3.1", default-features = false, features = ["prove"] }
anyhow = { workspace = true }
# The user ELF inside a program binary, for the guest lints.
risc0-binfmt = "3.0.6"
hemiprove-eth-prelude = { path = "../../eth-prelude", features = ["std"] }
hemiprove-proxy-slots = { path = "../statement", features = ["std"] }
alloy-primitives = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
tokio = { workspace = true }
tempfile = "3"
zkminer-config = { workspace = true }
zkminer-netguard = { workspace = true }
zkminer-witness = { workspace = true }
zkminer-witness-broker = { path = "../../../crates/zkminer-witness-broker" }
zkminer-witness-host = { path = "../../../crates/zkminer-witness-host" }
zkminer-witness-sandbox = { workspace = true }
