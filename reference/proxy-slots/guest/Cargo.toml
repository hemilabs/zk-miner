[package]
name = "proxy-slots"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace and lockfile, like every risc0 guest in this repository: built for
# riscv32im-risc0-zkvm-elf by risc0-build (reference/proxy-slots/methods).
[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false }
risc0-zkvm-platform = { version = "2.2", default-features = false }
hemiprove-proxy-slots = { path = "../statement" }
