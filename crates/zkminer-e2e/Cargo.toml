[package]
name = "zkminer-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "End-to-end tests that drive the built zkminer binary from the outside"

# Not in the workspace's default-members: these tests need prebuilt binaries
# (`zkminer`, `mock-worker`). Run them with `make e2e`.

[dependencies]
serde_json = { workspace = true }
tempfile = "3.20"
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
rstest = "0.23"
