[package]
name = "zkminer-witness-broker"
version.workspace = true
edition.workspace = true
description = "The witness-job fetch broker: typed evm-rpc/v1 and blob/v1 capabilities, hemi-code artifact reads"

[[bin]]
name = "zkminer-witness-broker"
path = "src/main.rs"

[dependencies]
zkminer-witness = { path = "../zkminer-witness" }
zkminer-witness-sandbox = { path = "../zkminer-witness-sandbox" }
tokio = { workspace = true }
# No default features: no system proxy, no decompression, no HTTP/2; TLS is rustls with the compiled-in
# webpki roots (never a CA bundle read from disk, which the sandbox forbids).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
futures = { workspace = true }
libc = "0.2"
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
proptest = "1"
