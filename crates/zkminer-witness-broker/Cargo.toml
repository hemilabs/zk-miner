[package]
name = "zkminer-witness-broker"
version.workspace = true
edition.workspace = true
description = "The witness-job fetch broker: typed evm-rpc/v1 and blob/v1 capabilities, hemi-code artifact reads"

[[bin]]
name = "zkminer-witness-broker"
path = "src/main.rs"

[dependencies]
zkminer-witness = { path = "../zkminer-witness" }
zkminer-witness-sandbox = { path = "../zkminer-witness-sandbox" }
# The one network predicate (no HTTP client: the broker wires its own).
zkminer-netguard = { workspace = true }
tokio = { workspace = true }
# The HTTP client: hyper's HTTP/1.1 client over TCP sockets the miner's connector hands the
# broker (`connector`), TLS by rustls (ring) with the compiled-in webpki roots (never a CA bundle
# read from disk, which the sandbox forbids). No proxy, no redirects, no decompression, no HTTP/2:
# none of them exists in this stack.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1"
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
futures = { workspace = true }
libc = "0.2"
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Test clients only (anvil, the redirect control); the broker itself has no reqwest.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
proptest = "1"

# A compromised broker under the real sandbox (review r2 F5): the test re-executes itself as the
# probe, so it needs its own `main` (restrict_self refuses a process with a second thread).
[[test]]
name = "broker_escape"
path = "tests/broker_escape.rs"
harness = false
