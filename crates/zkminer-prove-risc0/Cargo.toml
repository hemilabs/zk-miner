[package]
name = "zkminer-prove-risc0"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zkminer-prove-risc0"
path = "src/main.rs"
required-features = ["macos"]

[[bin]]
name = "zkminer-prove-risc0-cuda"
path = "src/main.rs"
required-features = ["cuda"]

[[bin]]
name = "zkminer-prove-risc0-rocm"
path = "src/main.rs"
required-features = ["rocm"]

[[bin]]
name = "zkminer-prove-risc0-intel"
path = "src/main.rs"
required-features = ["intel"]

[features]
macos = ["risc0-zkvm/disable-dev-mode", "dep:serde_json", "dep:sha2"]
# Deprecated compatibility name: compilation emits migration guidance.
macos-metal = ["macos"]
# Build tooling also selects the local engine's native-groth16 feature.
macos-native-wrap = ["macos"]
# Build tooling also enables the local engine's metal-recursion feature.
macos-recursion-metal = ["macos-native-wrap", "dep:metal"]
# Tooling also selects the local engine's metal-rv32im + metal-recursion features.
macos-rv32im-metal = ["macos-recursion-metal", "dep:risc0-zkp"]
cuda = ["risc0-zkvm/cuda", "risc0-groth16/cuda"]
rocm = ["risc0-zkvm/rocm", "risc0-groth16/rocm"]
# Intel Arc / Data Center GPUs through SYCL on Level Zero. Built with oneAPI's `icpx` (see the README's
# Intel section); the kernels' shared libraries are found next to the binary (`$ORIGIN`, set in build.rs).
intel = ["risc0-zkvm/intel", "risc0-groth16/intel"]

[dependencies]
zkminer-prover-protocol = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bincode = "1"
libc = "0.2"
# The host key and per-(ELF, input) seed for the guest's `sys_rand`: see `sys_rand_seed`.
dirs = { workspace = true }
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove"] }
# Directly, to check a measured guest's keccak proof requests as the prover will (`KeccakAudit`).
risc0-circuit-keccak = { version = "4.0", features = ["prove"] }
# Directly, for `prove::release_srs`: the Groth16 SRS cache on the GPU has to be freed after each proof
# on a card too small to hold it beside the next STARK. See `release_groth16_cache_if_tight`.
risc0-groth16 = { version = "3.0" }
# Installing the risc0-groth16 component on a host without rzup (`groth16_component`): the download
# (rustls with its own roots, so neither OpenSSL nor the host's CA store is needed) and the tar.xz.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
liblzma = { version = "0.4", features = ["parallel"] }
tar = "0.4"

[package.metadata.risc0]
methods = [
    "../zkminer-prover/guests/risc0/fibonacci",
    "../zkminer-prover/guests/risc0/sha256-chain",
    "../zkminer-prover/guests/risc0/ecdsa-verify",
    "../zkminer-prover/guests/risc0/bigint-mul",
    "../zkminer-prover/guests/risc0/memory-merkle",
    "../zkminer-prover/guests/risc0/chacha-mix",
    "../zkminer-prover/guests/risc0/rv32im-torture",
    "../zkminer-prover/guests/risc0/edge-case-arith",
    "../zkminer-prover/guests/risc0/memory-stress",
    "../zkminer-prover/guests/risc0/precompile-interleave",
    "../zkminer-prover/guests/risc0/segment-boundary",
    "../zkminer-prover/guests/risc0/babybear-stress",
    "../zkminer-prover/guests/risc0/minimal-proof",
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
risc0-build = "3.0"
risc0-binfmt = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
risc0-zkp = { version = "3.0", default-features = false, optional = true }
metal = { version = "0.29", optional = true }
