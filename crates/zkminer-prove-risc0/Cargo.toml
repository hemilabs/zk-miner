[package]
name = "zkminer-prove-risc0"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zkminer-prove-risc0-cuda"
path = "src/main.rs"
required-features = ["cuda"]

[[bin]]
name = "zkminer-prove-risc0-rocm"
path = "src/main.rs"
required-features = ["rocm"]

[[bin]]
name = "zkminer-prove-risc0-intel"
path = "src/main.rs"
required-features = ["intel"]

# No GPU toolkit: measures (executes) guests and derives image ids on the CPU, for a host with no GPU
# that only sizes jobs (`zkminer simulate`, `zkminer run --watch-only`). It can prove, but on the CPU,
# far too slowly for a lock's deadline, so never name it as a mining worker.
[[bin]]
name = "zkminer-prove-risc0-cpu"
path = "src/main.rs"
required-features = ["cpu"]

# Apple Silicon Macs through Metal (the risc0 fork's `metal` backend). macOS on aarch64 only; the worker
# refuses Intel Macs and 8 GB Macs at runtime (it requires 16 GB; the check is `hw.memsize` >= 12 GiB,
# so rounding never refuses a 16 GB Mac; see `metal_host.rs`).
[[bin]]
name = "zkminer-prove-risc0-metal"
path = "src/main.rs"
required-features = ["metal"]

[features]
cuda = ["risc0-zkvm/cuda", "risc0-groth16/cuda"]
rocm = ["risc0-zkvm/rocm", "risc0-groth16/rocm"]
# Intel Arc / Data Center GPUs through SYCL on Level Zero. Built with oneAPI's `icpx` (see the README's
# Intel section); the kernels' shared libraries are found next to the binary (`$ORIGIN`, set in build.rs).
intel = ["risc0-zkvm/intel", "risc0-groth16/intel"]
# The first three are the fan-out of PLAN 8.1. The rest are what the worker calls directly: the
# per-circuit Metal pipeline warm-ups (rv32im, recursion, keccak, groth16-sys), the device name
# (risc0-zkp) and the device's working-set limit and allocation (metal).
metal = [
    "risc0-zkvm/metal",
    "risc0-groth16/metal",
    "risc0-circuit-keccak/metal",
    "dep:risc0-zkp",
    "risc0-zkp/metal",
    "dep:risc0-circuit-rv32im",
    "risc0-circuit-rv32im/metal",
    "dep:risc0-circuit-recursion",
    "risc0-circuit-recursion/metal",
    "dep:risc0-groth16-sys",
    "risc0-groth16-sys/metal",
    "dep:metal",
    "dep:rayon",
]
cpu = []
# Test only: the worker leaks `ZKMINER_TEST_LEAK_MIB_PER_PROOF` MiB per proof (`main.rs`,
# `test_leak`), for the real-worker growth-net test in `tests/metal_worker.rs`. Never in a release
# build's defaults.
testing = []

[dependencies]
zkminer-prover-protocol = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bincode = "1"
libc = "0.2"
# The host key and per-(ELF, input) seed for the guest's `sys_rand`: see `sys_rand_seed`.
dirs = { workspace = true }
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove"] }
# Directly, to check a measured guest's keccak proof requests as the prover will (`KeccakAudit`).
risc0-circuit-keccak = { version = "4.0", features = ["prove"] }
# Directly, for `prove::release_srs`: the Groth16 SRS cache on the GPU has to be freed after each proof
# on a card too small to hold it beside the next STARK. See `release_groth16_cache_if_tight`.
risc0-groth16 = { version = "3.0" }
# Installing the risc0-groth16 component on a host without rzup (`groth16_component`): the download
# (rustls with its own roots, so neither OpenSSL nor the host's CA store is needed) and the tar.xz.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
liblzma = { version = "0.4", features = ["parallel"] }
tar = "0.4"
# Metal only (feature `metal`): see the feature's comment.
risc0-zkp = { version = "3.0", optional = true }
risc0-circuit-rv32im = { version = "4.0", optional = true }
risc0-circuit-recursion = { version = "4.0", optional = true }
risc0-groth16-sys = { version = "0.1", optional = true }
# Metal only: the worker builds rayon's global pool (risc0's CPU work) with user-initiated QoS
# threads (M9, `metal_start::apply_proving_qos`). The same rayon as risc0's, so it is that pool.
rayon = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }

[package.metadata.risc0]
methods = [
    "../zkminer-prover/guests/risc0/fibonacci",
    "../zkminer-prover/guests/risc0/sha256-chain",
    "../zkminer-prover/guests/risc0/ecdsa-verify",
    "../zkminer-prover/guests/risc0/bigint-mul",
    "../zkminer-prover/guests/risc0/memory-merkle",
    "../zkminer-prover/guests/risc0/chacha-mix",
    "../zkminer-prover/guests/risc0/rv32im-torture",
    "../zkminer-prover/guests/risc0/edge-case-arith",
    "../zkminer-prover/guests/risc0/memory-stress",
    "../zkminer-prover/guests/risc0/precompile-interleave",
    "../zkminer-prover/guests/risc0/segment-boundary",
    "../zkminer-prover/guests/risc0/babybear-stress",
    "../zkminer-prover/guests/risc0/minimal-proof",
]

[dev-dependencies]
tempfile = "3"
# The dispatcher (with its test hooks), so `tests/metal_worker.rs` can drive a real Metal worker
# through it (M9's growth-net test).
zkminer-prover = { workspace = true, features = ["testing"] }

[build-dependencies]
risc0-build = "3.0"
