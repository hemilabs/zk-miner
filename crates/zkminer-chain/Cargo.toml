[package]
name = "zkminer-chain"
version.workspace = true
edition.workspace = true

[dependencies]
zkminer-contracts = { workspace = true }
zkminer-config = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# rustls with the compiled-in webpki roots, as everywhere in the workspace: reqwest's default
# features would select native-tls (OpenSSL) for every crate built in the same invocation, the
# witness broker's included, and OpenSSL cannot read a CA store inside its sandbox (review r2).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
zkminer-netguard = { workspace = true, features = ["client"] }
dirs = { workspace = true }
tower = "0.4"
alloy-json-rpc = "1"
serde_json = { workspace = true }

[dev-dependencies]
zkminer-prover = { workspace = true }
# Paused-clock tests of the RPC lanes and the governance watcher.
tokio = { workspace = true, features = ["test-util"] }
# The test seam that lets a public-mode fetch be served from loopback (never in a release build).
zkminer-netguard = { workspace = true, features = ["client", "test-util"] }
