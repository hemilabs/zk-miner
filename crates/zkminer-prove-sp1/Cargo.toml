[package]
name = "zkminer-prove-sp1"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zkminer-prove-sp1"
path = "src/main.rs"

[dependencies]
zkminer-prover-protocol = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bincode = "1"
sha2 = "0.10"
libc = "0.2"
# Needed only to drop the CudaProver / proving keys inside a runtime context at
# shutdown (the SDK does async teardown of the sp1-gpu-server). sp1-sdk already
# pulls tokio, so the feature set is unified — no extra compile cost.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
sp1-sdk = { version = "6.0", features = ["blocking", "cuda"] }
# Directly only for `build::groth16_circuit_artifacts_dir`, which sp1-sdk 6.8 no longer re-exports;
# sp1-sdk depends on it already.
sp1-prover = "6.0"

[build-dependencies]
sp1-build = "6.0"

[dev-dependencies]
# For the error and socket path the SDK does not re-export, which this worker reads the text of and
# mirrors: the tests hold those to the pinned SDK. sp1-sdk depends on it already.
sp1-cuda = "6.0"
# For the version a stand-in server must report. Also through sp1-sdk.
sp1-primitives = "6.0"

[[test]]
name = "server_faults"
# Its own `main`, as the same binary also plays the server the worker starts.
harness = false
