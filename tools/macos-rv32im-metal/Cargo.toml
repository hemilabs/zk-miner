risc0-circuit-rv32im-sys = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8" }
risc0-zkp = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8", features = ["metal-runtime"] }
