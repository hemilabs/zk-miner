name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # TEMPORARY: no automatic CI on PRs from the beta branches (metal-3.1, metal-3.1-v2,
    # netguard-mac-v2) while they are tested by hand; run it with workflow_dispatch instead.
    # To re-enable, drop the !contains(fromJSON(...), github.head_ref) condition.
    if: ${{ github.event_name != 'pull_request' || !contains(fromJSON('["metal-3.1","metal-3.1-v2","netguard-mac-v2"]'), github.head_ref) }}
    # Everything (Rust, foundry, the tests) runs inside the `e2e` Docker stage.
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run e2e tests"
        run: make e2e PROGRESS=plain
