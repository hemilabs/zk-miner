name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Run on demand (any branch), e.g. while PRs from metal-3.1 skip it (see the job's `if`).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # TEMPORARY: no automatic CI on PRs from metal-3.1 while it is tested by hand on the other
    # platforms; run it with workflow_dispatch instead. Remove this line to re-enable.
    if: ${{ github.event_name != 'pull_request' || !contains(fromJSON('["metal-3.1","metal-3.1-v2","netguard-mac-v2"]'), github.head_ref) }}
    # Everything (Rust, foundry, the tests) runs inside the `e2e` Docker stage.
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run e2e tests"
        run: make e2e PROGRESS=plain

  advisories:
    # RustSec advisories against Cargo.lock; deny.toml lists the ones that do not reach a miner.
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install cargo-deny"
        run: cargo install --locked cargo-deny --version 0.22.0

      - name: "Check advisories"
        run: cargo deny check advisories
