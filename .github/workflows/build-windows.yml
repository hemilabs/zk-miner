name: Build Windows Binaries

on:
  workflow_dispatch:
    inputs:
      build_cli:
        description: 'Build CLI (.exe)'
        type: boolean
        default: true
      build_cuda:
        description: 'Build CUDA prover (.exe)'
        type: boolean
        default: true

  # NO tag trigger. The cuda-windows job below references a non-allowlisted
  # action, which fails the entire run at STARTUP -- so a tag would reliably put
  # a red check on an otherwise-good release. release.yml owns the tag path and
  # gets its Windows CLI from the Dockerfile's cross-compile instead. Restore
  # this trigger once `Jimver/cuda-toolkit@*` is allowlisted.

  # Callable from release.yml so a tagged release reuses these exact jobs.
  workflow_call:
    inputs:
      retention_days:
        description: 'How long to keep the uploaded artifacts'
        type: number
        default: 14
        required: false
      # Declared so the job `if:` below evaluates true when CALLED. Without these
      # the guards read an undefined `inputs.build_cli` under a manually
      # dispatched release and BOTH Windows jobs silently skip, producing a
      # release with no Windows binaries at all.
      build_cli:
        type: boolean
        default: true
        required: false
      build_cuda:
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.93.0'
  CUDA_VERSION: '12.8.0'

jobs:
  # -----------------------------------------------------------------------
  # CLI — cross-compiled from Linux (fast, ~5 min)
  # -----------------------------------------------------------------------
  cli-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cli }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lld llvm

      # rustup is preinstalled on GitHub runners. `dtolnay/rust-toolchain` is NOT
      # on this repo's allowed-actions list, and an action outside that list fails
      # the whole run at startup before any job executes.
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add x86_64-pc-windows-msvc

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cli-

      - name: Install cargo-xwin
        run: cargo install cargo-xwin

      - name: Cross-compile CLI for Windows
        env:
          RUSTFLAGS: '-C target-cpu=x86-64-v3 -C target-feature=+crt-static'
        run: |
          cargo xwin build --release --target x86_64-pc-windows-msvc \
            -p zkminer-cli --bin zkminer

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/zkminer.exe dist/
          cd dist && sha256sum zkminer.exe > zkminer.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zkminer-windows-cli
          path: dist/zkminer.exe*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

  # -----------------------------------------------------------------------
  # CUDA prover — native Windows build (requires MSVC + CUDA toolkit)
  #
  # BLOCKED BY POLICY: `Jimver/cuda-toolkit` is not on this repo's
  # allowed-actions list (`allowed_actions: selected`), and referencing an action
  # outside that list fails the entire run at startup. So this job cannot run as
  # written, and release.yml deliberately does NOT call this workflow -- it would
  # take the release down with it. To ship a native Windows prover, either add
  # `Jimver/cuda-toolkit@*` to the allowlist or replace this step with a manual
  # silent install of the CUDA network installer.
  # -----------------------------------------------------------------------
  cuda-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cuda }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'

      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cuda-${{ hashFiles('Cargo.lock') }}-${{ env.CUDA_VERSION }}
          restore-keys: windows-cuda-

      - name: Build CUDA prover
        env:
          RISC0_SKIP_BUILD: '1'
          RISC0_SKIP_BUILD_KERNELS: '1'
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
          NVCC_APPEND_FLAGS: >-
            -gencode arch=compute_75,code=sm_75
            -gencode arch=compute_80,code=sm_80
            -gencode arch=compute_86,code=sm_86
            -gencode arch=compute_89,code=sm_89
            -gencode arch=compute_90,code=sm_90
            -gencode arch=compute_100,code=sm_100
            -gencode arch=compute_120,code=compute_120
        run: |
          cargo build --release -p zkminer-prove-risc0 --features cuda --bin zkminer-prove-risc0-cuda

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/zkminer-prove-risc0-cuda.exe dist/
          cd dist && sha256sum zkminer-prove-risc0-cuda.exe > zkminer-prove-risc0-cuda.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zkminer-windows-cuda
          path: dist/zkminer-prove-risc0-cuda.exe*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
